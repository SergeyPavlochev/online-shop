apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.11.0
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: SERVER_NAME
              value: "kibana-snb"
            - name: SERVER_BASEPATH
              value: ""
            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
              value: "snb-kibana-encryption-key-change-me-please"
            - name: XPACK_REPORTING_ENCRYPTIONKEY
              value: "snb-kibana-reporting-key-change-me-please"
            - name: XPACK_SECURITY_ENCRYPTIONKEY
              value: "snb-kibana-security-key-change-me-please"
          ports:
            - containerPort: 5601
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: app
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: "order-service"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql.infra.svc.cluster.local:5432/order_db"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_LIQUIBASE_ENABLED: "true"
  SPRING_LIQUIBASE_CHANGE_LOG: "classpath:db/changelog/db.changelog-master.yaml"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.infra.svc.cluster.local:9092"
  SPRING_KAFKA_CONSUMER_GROUP_ID: "order-service-group"
  APP_KAFKA_TOPIC_OUTBOX: "orders"
  APP_KAFKA_TOPIC_BATCH_SIZE: "50"
  APP_OUTBOX_RETRY_DELAY_SECONDS: "30"
  APP_OUTBOX_SCHEDULE_CRON: "*/1 * * * * *"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: "/actuator"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_SERVER_PORT: "8081"
  MANAGEMENT_METRICS_DISTRIBUTION_SLO_HTTP_SERVER_REQUESTS: "1ms, 2ms, 3ms, 4ms, 5ms, 6ms, 7ms, 8ms, 9ms, 10ms, 20ms, 50ms, 100ms, 150ms, 200ms, 500ms"
  MANAGEMENT_METRICS_TAGS_APPLICATION: "order-service"
  KEYCLOAK_ISSUER_URI: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/onlineshop"
  KEYCLOAK_JWK_SET_URI: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/onlineshop/protocol/openid-connect/certs"
  APP_BILLING_BASE_URL: "http://billing-svc:80"
  APP_WAREHOUSE_BASE_URL: "http://warehouse-svc:80"
  APP_DELIVERY_BASE_URL: "http://delivery-svc:80"
  KEYCLOAK_M2M_CLIENT_ID: "order-service-m2m"
  KEYCLOAK_TOKEN_URI: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/onlineshop/protocol/openid-connect/token"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: app
  labels:
    app: order-service
spec:
  replicas: 1
  minReadySeconds: 15
  strategy:
    rollingUpdate:
      maxSurge: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-container
          image: leokot/order-service:1.2.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: order-config
          env:
            - name: KEYCLOAK_M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: keycloakM2MClientSecret
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-password
---
apiVersion: v1
kind: Service
metadata:
  name: order-svc
  namespace: app
  labels:
    app: order-service
    efk: online-shop
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 8081
      protocol: TCP
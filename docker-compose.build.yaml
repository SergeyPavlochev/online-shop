services:
  auth-service:
    image: leokot/auth-service:${VERSION:-1.2.0}
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
      args:
        SERVICE_NAME: auth-service
      tags:
        - "leokot/auth-service:${VERSION:-1.2.0}"
        - "leokot/auth-service:latest"

  billing-service:
    image: leokot/billing-service:${VERSION:-1.2.0}
    build:
      context: .
